# This image is created from test/Dockerfile
image: registry.gitlab.com/sosy-lab/software/cpu-energy-meter/test:latest

variables:
  GIT_SUBMODULE_STRATEGY: recursive

before_script:
  - make clean

stages:
  - images
  - build
  - test
  - dist

build:
  stage: build
  script:
    - make
  artifacts:
    paths:
      - cpu-energy-meter

test:
  stage: test
  script:
    - make test

# check license declarations etc.
reuse:
  stage: test
  image:
    name: fsfe/reuse:latest
    entrypoint: [""]
  dependencies: []
  needs: []
  before_script: []
  script:
    - reuse lint

deb:
  stage: dist
  script:
    - scripts/create_deb.sh
  artifacts:
    paths:
      - "*.deb"

# Build Docker images
# following this guideline: https://docs.gitlab.com/ee/ci/docker/using_kaniko.html
# Build container images
.build-docker:
  stage: images
  image:
    name: quay.io/podman/stable
  variables:
    BUILD_CONTEXT: "-"
  tags:
    - podman
  before_script:
    - podman login "$CI_REGISTRY" --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD"
  script:
    - echo "Building $CI_REGISTRY_IMAGE/$IMAGE from $DOCKERFILE"
    - podman build --pull -t $CI_REGISTRY_IMAGE/$IMAGE $BUILD_CONTEXT < $CI_PROJECT_DIR/$DOCKERFILE
    - podman push $CI_REGISTRY_IMAGE/$IMAGE
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

build-docker:test:
  extends: .build-docker
  variables:
    DOCKERFILE: test/Dockerfile
    IMAGE: test:latest
